name: Deploy to VPS

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - main
      - feature/saas-v2

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm run build
        env:
          # VITE_POCKETBASE_URL kini dinamis (otomatis deteksi domain)
          VITE_APP_NAME: "EXAM-AA"
          VITE_AUTH_USERNAME_DOMAIN: "https://assets.alfaruqasri.my.id"
          VITE_R2_BUCKET: "piket"
          VITE_R2_ENDPOINT: "https://fbb45dee06536009648061725236f3d9.r2.cloudflarestorage.com"
          VITE_R2_PUBLIC_BASE_URL: "https://pub-a1193e163fef41c9afc15d1334b8740b.r2.dev"
          VITE_R2_ACCESS_KEY_ID: ${{ secrets.VITE_R2_ACCESS_KEY_ID }}
          VITE_R2_SECRET_ACCESS_KEY: ${{ secrets.VITE_R2_SECRET_ACCESS_KEY }}
          VITE_R2_WORKER_URL: "https://r2-delete-worker.faruq-blogger.workers.dev"
          VITE_DISABLE_EXAMBRO_GUARD: "false"

      - name: Kirim build ke VPS (/opt/frontend)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_REMOTE_DIR: ${{ secrets.SSH_REMOTE_DIR }}
        run: |
          set -euo pipefail
          TARGET="${SSH_REMOTE_DIR}"
          echo "Host   : $SSH_HOST"
          echo "Target : $TARGET"

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 22 -H "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null || true
          SSHC="ssh -i $HOME/.ssh/deploy_key -p 22 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ConnectTimeout=30"

          echo "--- uji koneksi ---"
          $SSHC "$SSH_USER@$SSH_HOST" 'echo "  terhubung ke: $(hostname)"'

          echo "--- siapkan folder penerima di VPS ---"
          $SSHC "$SSH_USER@$SSH_HOST" "rm -rf /tmp/examku_incoming && mkdir -p /tmp/examku_incoming && echo '  folder siap'"

          echo "--- kirim paket ---"
          TARBALL=/tmp/rollout.tar.gz
          tar -czf "$TARBALL" -C dist .
          echo "  ukuran paket: $(du -h $TARBALL | cut -f1)"

          # Data (tar) masuk lewat stdin, skrip remote lewat argumen -> TIDAK bentrok
          $SSHC "$SSH_USER@$SSH_HOST" "cd /tmp/examku_incoming && tar -xzf -" < "$TARBALL"

          echo "--- pasang di $TARGET ---"
          $SSHC "$SSH_USER@$SSH_HOST" "TARGET='$TARGET' bash -c '
            set -e
            echo \"  file diterima : \$(find /tmp/examku_incoming -type f | wc -l)\"
            test -f /tmp/examku_incoming/index.html || { echo \"GAGAL: index.html tidak ada\"; exit 1; }
            test -n \"\$TARGET\" || { echo \"GAGAL: TARGET kosong\"; exit 1; }

            # AMAN: tidak menimpa folder di luar TARGET (mis. /opt/frontend/ujian)
            if [ \"\$TARGET\" = \"/\" ] || [ \"\$TARGET\" = \"/opt\" ] || [ \"\$TARGET\" = \"/opt/frontend\" ]; then
              echo \"GAGAL: TARGET=\$TARGET terlalu luas, dibatalkan.\"; exit 1
            fi

            # jangan pernah pakai rm -rf isi TARGET langsung.
            # pola atomik: siapkan di samping, rename, baru hapus cadangan lama.
            STAGE=\"\$TARGET.new.\$\$\"
            mkdir -p \"\$STAGE\"
            cp -a /tmp/examku_incoming/. \"\$STAGE\"/
            chmod -R 755 \"\$STAGE\"
            test -f \"\$STAGE/index.html\" || { echo \"GAGAL: staging tidak lengkap\"; rm -rf \"\$STAGE\"; exit 1; }

            OLD=\"\$TARGET.old.\$\$\"
            if [ -d \"\$TARGET\" ]; then mv \"\$TARGET\" \"\$OLD\"; fi
            mv \"\$STAGE\" \"\$TARGET\"
            echo \"  index.html    : \$(stat -c%s \"\$TARGET/index.html\") bytes\"
            echo \"  total file    : \$(find \"\$TARGET\" -type f | wc -l)\"
            rm -rf /tmp/examku_incoming
            echo \"  cadangan lama : \$OLD  (hapus manual bila sudah yakin)\"
            echo SELESAI
          '"

      - name: Verifikasi hasil deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_REMOTE_DIR: ${{ secrets.SSH_REMOTE_DIR }}
        run: |
          set -euo pipefail
          TARGET="${SSH_REMOTE_DIR}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSHC="ssh -i ~/.ssh/deploy_key -p 22 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR"

          $SSHC "$SSH_USER@$SSH_HOST" "TARGET='$TARGET' bash -s" << 'REMOTE'
          set -e
          echo "== Isi $TARGET =="
          ls -la "$TARGET" | head -15
          echo
          echo "== index.html =="
          test -f "$TARGET/index.html" || { echo "GAGAL: index.html tidak ada!"; exit 1; }
          BUNDLE=$(grep -oE 'index-[A-Za-z0-9_-]+\.js' "$TARGET/index.html" | head -1)
          echo "Bundle terpasang : $BUNDLE"
          echo "Ukuran index.html: $(stat -c%s "$TARGET/index.html") bytes"
          echo "Total file       : $(find "$TARGET" -type f | wc -l)"
          echo "Waktu            : $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          REMOTE

          echo
          echo "== Uji dari luar =="
          sleep 3
          curl -s -m 25 https://examku.my.id/ -o /tmp/live.html -w "  HTTP %{http_code}  %{size_download} bytes\n" || true
          if [ -f /tmp/live.html ]; then
            LIVE=$(grep -oE 'index-[A-Za-z0-9_-]+\.js' /tmp/live.html | head -1)
            echo "  Bundle live    : ${LIVE:-tidak terdeteksi}"
          fi

      - name: Purge cache Cloudflare (opsional)
        if: ${{ secrets.CF_ZONE_ID != '' && secrets.CF_API_TOKEN != '' }}
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -uo pipefail
          echo "== Purge cache Cloudflare =="
          BODY='{"purge_everything":true}'
          CODE=$(curl -s -o /tmp/purge.json -w "%{http_code}" -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$BODY")
          echo "  HTTP $CODE"
          if [ "$CODE" = "200" ]; then
            echo "  ✅ cache dibersihkan — siswa langsung dapat versi terbaru"
          else
            echo "  ⚠️  purge gagal (bukan penghalang deploy):"
            head -c 500 /tmp/purge.json; echo
          fi
