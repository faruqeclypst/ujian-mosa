name: Deploy to VPS

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - main
      - feature/saas-v2

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm run build
        env:
          # VITE_POCKETBASE_URL kini dinamis (otomatis deteksi domain)
          VITE_APP_NAME: "EXAM-AA"
          VITE_AUTH_USERNAME_DOMAIN: "https://assets.alfaruqasri.my.id"
          VITE_R2_BUCKET: "piket"
          VITE_R2_ENDPOINT: "https://fbb45dee06536009648061725236f3d9.r2.cloudflarestorage.com"
          VITE_R2_PUBLIC_BASE_URL: "https://pub-a1193e163fef41c9afc15d1334b8740b.r2.dev"
          VITE_R2_ACCESS_KEY_ID: ${{ secrets.VITE_R2_ACCESS_KEY_ID }}
          VITE_R2_SECRET_ACCESS_KEY: ${{ secrets.VITE_R2_SECRET_ACCESS_KEY }}
          VITE_R2_WORKER_URL: "https://r2-delete-worker.faruq-blogger.workers.dev"
          VITE_DISABLE_EXAMBRO_GUARD: "false"

      - name: Deploy ke VPS (/opt/frontend)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            TARGET="${{ secrets.SSH_REMOTE_DIR }}"
            if [ -z "$TARGET" ]; then TARGET="/opt/frontend"; fi
            echo "Target deploy : $TARGET"
            echo "Host          : $(hostname)"
            echo "--- menyiapkan folder ---"
            mkdir -p "$TARGET"
            mkdir -p /tmp/rollout
            rm -rf /tmp/rollout/*
            echo "--- menerima file ---"
            tar -xzf - -C /tmp/rollout
            echo "  file diterima : $(find /tmp/rollout -type f | wc -l)"
            if [ ! -f /tmp/rollout/index.html ]; then
              echo "GAGAL: index.html tidak ada di paket"; exit 1
            fi
            echo "--- backup build lama ---"
            if [ -d "$TARGET" ]; then
              rm -rf /tmp/frontend_prev
              cp -a "$TARGET" /tmp/frontend_prev 2>/dev/null || true
            fi
            echo "--- memasang build baru ---"
            find "$TARGET" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            cp -a /tmp/rollout/. "$TARGET"/
            echo "  index.html terpasang : $(ls -la $TARGET/index.html | awk '{print $5" bytes"}')"
            chown -R www-data:www-data "$TARGET" 2>/dev/null || true
            chmod -R 755 "$TARGET"
            echo "SELESAI"

      - name: Verifikasi hasil deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            set -e
            DIR="${{ secrets.SSH_REMOTE_DIR }}"
            echo "== Isi $DIR =="
            ls -la "$DIR" | head -20
            echo
            echo "== index.html =="
            test -f "$DIR/index.html" || { echo "GAGAL: index.html tidak ada!"; exit 1; }
            echo "Bundle terpasang: $(grep -oE 'index-[A-Za-z0-9_-]+\.js' "$DIR/index.html" | head -1)"
            echo "Commit          : ${{ github.sha }}"
            echo "Waktu           : $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Total file      : $(find "$DIR" -type f | wc -l)"
