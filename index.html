  <style>
    #preloader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      gap: 24px;
      z-index: 9999;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity 0.3s ease-out, visibility 0.3s ease-out;
      opacity: 1;
      visibility: visible;
    }

    #preloader.preloader-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .dark #preloader {
      background: #020617;
    }

    .spinner-wrapper {
      position: relative;
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .spinner-glow {
      position: absolute;
      inset: 0;
      background: rgba(16, 185, 129, 0.2);
      filter: blur(28px);
      border-radius: 9999px;
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    .spinner {
      width: 80px;
      height: 80px;
      box-sizing: border-box;
      border: 4px solid rgba(16, 185, 129, 0.1);
      border-top: 4px solid #10b981;
      border-radius: 32px;
      position: relative;
      z-index: 10;
      animation: squircleSpin 1.5s ease-in-out infinite;
    }

    @keyframes squircleSpin {
      0% {
        transform: rotate(0deg);
        border-radius: 32px;
      }
      50% {
        border-radius: 16px;
      }
      100% {
        transform: rotate(360deg);
        border-radius: 32px;
      }
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.5;
      }
    }

    .preloader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      position: relative;
      z-index: 10;
    }

    .preloader-text {
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      color: #059669;
      margin: 0;
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    .dark .preloader-text {
      color: #34d399;
    }

    .preloader-subtext {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #94a3b8;
      margin: 0;
    }

    .dark .preloader-subtext {
      color: #64748b;
    }
  </style>
  <script>
    (function () {
      const theme = localStorage.getItem('theme') || 'light';
      const root = document.documentElement;
      const isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (isDark) {
        root.classList.add('dark');
      } else {
        root.classList.add('light');
      }
      const metaTheme = document.getElementById('theme-color-meta');
      if (metaTheme) {
        metaTheme.setAttribute('content', isDark ? '#0f172a' : '#ffffff');
      }
    })();
  </script>

<body class="min-h-screen bg-background font-sans antialiased">
