<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=contain, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#090d16" />
  <title>EXAM AA Browser</title>
  <script src="./html5-qrcode.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #090d16;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 16px;
      padding-top: max(20px, env(safe-area-inset-top, 0px));
      padding-bottom: max(20px, env(safe-area-inset-bottom, 0px));
    }

    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Header */
    .header {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .logo-badge {
      width: 54px;
      height: 54px;
      border-radius: 16px;
      background-color: #1e293b;
      border: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #38bdf8;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
    }

    .title {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.5;
      max-width: 320px;
    }

    /* Card */
    .card {
      background-color: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .label {
      font-size: 12px;
      font-weight: 600;
      color: #cbd5e1;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    input[type="url"],
    input[type="text"] {
      width: 100%;
      background-color: #020617;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 14px;
      color: #ffffff;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="url"]:focus,
    input[type="text"]:focus {
      border-color: #38bdf8;
    }

    .input-actions {
      position: absolute;
      right: 8px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-icon {
      background: none;
      border: none;
      color: #94a3b8;
      padding: 6px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }

    .btn-icon:hover {
      color: #f8fafc;
      background-color: #1e293b;
    }

    /* Action buttons */
    .btn-qr {
      width: 100%;
      background-color: #1e293b;
      border: 1px solid #334155;
      color: #38bdf8;
      padding: 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn-qr:active {
      transform: scale(0.98);
      background-color: #334155;
    }

    /* Chips */
    .chips-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      background-color: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
    }

    .chip:hover {
      background-color: #334155;
      color: #ffffff;
    }

    /* History */
    .history-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-top: 4px;
      border-top: 1px solid #1e293b;
    }

    .history-title {
      font-size: 11px;
      color: #64748b;
      font-weight: 600;
    }

    .history-item {
      background-color: #020617;
      border: 1px solid #1e293b;
      color: #cbd5e1;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }

    .history-item:hover {
      background-color: #1e293b;
    }

    /* Pin Row */
    .pin-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 6px;
      border-top: 1px solid #1e293b;
    }

    .pin-input {
      width: 90px !important;
      text-align: center;
      font-family: monospace;
      font-size: 16px !important;
      letter-spacing: 2px;
      padding: 8px !important;
    }

    /* Submit Button */
    .btn-submit {
      width: 100%;
      background-color: #0284c7;
      border: none;
      color: #ffffff;
      padding: 14px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn-submit:active {
      transform: scale(0.98);
      background-color: #0369a1;
    }

    .btn-submit:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Security note */
    .footer-note {
      text-align: center;
      font-size: 11px;
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* QR Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 16px;
    }

    .modal-card {
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 20px;
      width: 100%;
      max-width: 360px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
    }

    .btn-close {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 20px;
      cursor: pointer;
    }

    #qr-reader {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
    }

    /* Floating Action Button (FAB) & Confirm Modal - Konsisten dengan Exam AA Utama */
    .fab-container {
      position: fixed;
      bottom: 24px;
      right: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 9990;
      user-select: none;
      touch-action: none;
    }

    .fab-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      animation: fabFadeIn 0.15s ease-out;
    }

    @keyframes fabFadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .fab-sub-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #ffffff;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3), 0 4px 6px -4px rgba(0, 0, 0, 0.2);
      transition: transform 0.1s ease;
    }

    .fab-sub-btn:active {
      transform: scale(0.9);
    }

    .fab-btn-refresh {
      background-color: #10b981;
      border-color: #34d399;
    }

    .fab-btn-exit {
      background-color: #ef4444;
      border-color: #f87171;
    }

    .fab-toggle-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid #34d399;
      background-color: #10b981;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 14px 25px -4px rgba(0, 0, 0, 0.4);
      transition: all 0.15s ease;
    }

    .fab-toggle-btn.open {
      background-color: #0f172a;
      border-color: #334155;
    }

    .fab-toggle-btn:active {
      transform: scale(0.92);
    }

    /* Modal Konfirmasi */
    .confirm-overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(2, 6, 23, 0.6);
      backdrop-filter: blur(2px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      padding: 24px;
    }

    .confirm-card {
      background-color: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 20px;
      width: 100%;
      max-width: 320px;
      padding: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      text-align: center;
    }

    .confirm-icon-box {
      width: 56px;
      height: 56px;
      background-color: #1e293b;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px auto;
    }

    .confirm-title {
      font-size: 17px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .confirm-desc {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .confirm-btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn-confirm-no {
      width: 100%;
      padding: 12px 0;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      color: #cbd5e1;
      background-color: #1e293b;
      border: none;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-confirm-no:active {
      transform: scale(0.95);
    }

    .btn-confirm-yes {
      width: 100%;
      padding: 12px 0;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      border: none;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .btn-confirm-yes.btn-blue {
      background-color: #2563eb;
    }

    .btn-confirm-yes.btn-rose {
      background-color: #e11d48;
    }

    .btn-confirm-yes:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="logo-badge" style="padding: 4px; overflow: hidden;">
        <img src="./icon-cbt-browser.png" alt="EXAM AA Browser" style="width: 100%; height: 100%; object-fit: contain;" />
      </div>
      <h1 class="title">EXAM AA Browser</h1>
      <p class="subtitle">Kiosk Browser Ujian Bebas. Masukkan URL atau scan QR code soal apa saja.</p>
    </div>

    <!-- Main Card -->
    <div class="card">
      <!-- URL Input -->
      <div class="form-group">
        <label class="label" for="urlInput">Tautan / URL Ujian</label>
        <div class="input-wrapper">
          <input
            id="urlInput"
            type="url"
            placeholder="https://forms.gle/... atau IP Lokal"
            autocomplete="off"
            spellcheck="false"
          />
          <div class="input-actions">
            <button id="btnClear" class="btn-icon" title="Hapus" style="display:none;">✕</button>
            <button id="btnPaste" class="btn-icon" title="Tempel URL">📋 Tempel</button>
          </div>
        </div>
      </div>

      <!-- Scan QR Button -->
      <button id="btnOpenScanner" class="btn-qr">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
        <span>Pindai QR Code Soal</span>
      </button>

      <!-- Quick Presets -->
      <div class="chips-group">
        <button class="chip" data-url="https://docs.google.com/forms">Google Forms</button>
        <button class="chip" data-url="https://forms.office.com">MS Forms</button>
        <button class="chip" data-url="https://quizizz.com/join">Quizizz</button>
      </div>

      <!-- History -->
      <div id="historySection" class="history-group" style="display:none;">
        <span class="history-title">Riwayat Tautan Terakhir:</span>
        <div id="historyList" style="display:flex; flex-direction:column; gap:4px;"></div>
      </div>

      <!-- Start Button -->
      <button id="btnStart" class="btn-submit">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
        <span>Mulai Ujian (Kunci Layar)</span>
      </button>
    </div>

    <!-- Footnote -->
    <div class="footer-note">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
      </svg>
      <span>Anti-Cheat, Layar Tersemat & Anti-Screenshot Aktif</span>
    </div>

    <!-- Exit App for Supervisor -->
    <div style="text-align: center; margin-top: 2px;">
      <button id="btnExitApp" type="button" style="background: none; border: 1px solid #334155; color: #94a3b8; font-size: 11px; padding: 6px 14px; border-radius: 8px; cursor: pointer;">
        ✕ Keluar Aplikasi (Pengawas)
      </button>
    </div>
  </div>

  <!-- QR Scanner Modal -->
  <div id="scannerModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">Arahkan Kamera ke QR Code</h3>
        <button id="btnCloseScanner" class="btn-close">✕</button>
      </div>
      <div id="qr-reader"></div>
      <button id="btnCancelScan" class="btn-qr" style="background:#1e293b; color:#cbd5e1;">Batal</button>
    </div>
  </div>

  <!-- Floating Menu FAB (Konsisten dengan Exam AA Utama) -->
  <div id="fabContainer" class="fab-container">
    <div id="fabActions" class="fab-actions" style="display: none;">
      <!-- Refresh Button -->
      <button id="btnFabRefresh" class="fab-sub-btn fab-btn-refresh" title="Muat Ulang">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
          <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
          <path d="M16 21h5v-5"/>
        </svg>
      </button>

      <!-- Exit Button -->
      <button id="btnFabExit" class="fab-sub-btn fab-btn-exit" title="Keluar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>

    <!-- Toggle Button -->
    <button id="btnFabToggle" class="fab-toggle-btn" aria-label="Menu Aksi">
      <svg id="fabIconDots" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <circle cx="12" cy="12" r="2.2"/>
        <circle cx="19" cy="12" r="2.2"/>
        <circle cx="5" cy="12" r="2.2"/>
      </svg>
      <svg id="fabIconClose" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>

  <!-- Confirm Dialog (Refresh & Exit) -->
  <div id="confirmOverlay" class="confirm-overlay">
    <div class="confirm-card">
      <div id="confirmIconBox" class="confirm-icon-box"></div>
      <h3 id="confirmTitle" class="confirm-title">Keluar Dari Aplikasi?</h3>
      <p id="confirmDesc" class="confirm-desc">Apakah Anda yakin ingin keluar dari aplikasi ujian?</p>
      <div class="confirm-btn-row">
        <button id="btnConfirmNo" type="button" class="btn-confirm-no">Tidak</button>
        <button id="btnConfirmYes" type="button" class="btn-confirm-yes btn-rose">Ya</button>
      </div>
    </div>
  </div>

  <script>
    const urlInput = document.getElementById('urlInput');
    const btnClear = document.getElementById('btnClear');
    const btnPaste = document.getElementById('btnPaste');
    const btnStart = document.getElementById('btnStart');
    const btnOpenScanner = document.getElementById('btnOpenScanner');
    const btnCloseScanner = document.getElementById('btnCloseScanner');
    const btnCancelScan = document.getElementById('btnCancelScan');
    const scannerModal = document.getElementById('scannerModal');
    const historySection = document.getElementById('historySection');
    const historyList = document.getElementById('historyList');

    let html5QrCode = null;

    // Load history & PIN
    function loadStorage() {
      try {
        const savedHistory = JSON.parse(localStorage.getItem('exambrowser_history') || '[]');
        if (savedHistory.length > 0) {
          historySection.style.display = 'flex';
          historyList.innerHTML = '';
          savedHistory.slice(0, 3).forEach(url => {
            const btn = document.createElement('button');
            btn.className = 'history-item';
            btn.textContent = url;
            btn.onclick = () => {
              urlInput.value = url;
              updateInputState();
            };
            historyList.appendChild(btn);
          });
        }
      } catch (e) {}

      // Lepaskan mode kuncian saat di halaman launcher agar leluasa mengetik & scan QR
      if (window.AndroidExam && window.AndroidExam.unlockScreen) {
        try {
          window.AndroidExam.unlockScreen();
        } catch (e) {}
      } else if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.CheatAlert) {
        try {
          window.Capacitor.Plugins.CheatAlert.unlockScreen();
        } catch (e) {}
      }
    }

    function saveToHistory(url) {
      try {
        let history = JSON.parse(localStorage.getItem('exambrowser_history') || '[]');
        history = [url, ...history.filter(h => h !== url)].slice(0, 5);
        localStorage.setItem('exambrowser_history', JSON.stringify(history));
        localStorage.setItem('exambrowser_pin', pinInput.value.trim() || '1234');
      } catch (e) {}
    }

    function updateInputState() {
      btnClear.style.display = urlInput.value ? 'block' : 'none';
      btnPaste.style.display = urlInput.value ? 'none' : 'block';
    }

    urlInput.addEventListener('input', updateInputState);
    urlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        startExam();
      }
    });

    btnClear.addEventListener('click', () => {
      urlInput.value = '';
      updateInputState();
      urlInput.focus();
    });

    btnPaste.addEventListener('click', async () => {
      try {
        const text = await navigator.clipboard.readText();
        if (text) {
          urlInput.value = text.trim();
          updateInputState();
        }
      } catch (e) {}
    });

    // Preset chips
    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        urlInput.value = chip.getAttribute('data-url');
        updateInputState();
      });
    });

    // Start Exam
    async function startExam(targetUrl) {
      let url = (targetUrl || urlInput.value).trim();
      if (!url) {
        alert('Silakan masukkan link URL ujian terlebih dahulu.');
        return;
      }

      if (!/^https?:\/\//i.test(url)) {
        url = 'https://' + url;
      }

      saveToHistory(url);
      const pin = '1234';

      btnStart.disabled = true;
      btnStart.textContent = 'Mengunci Layar & Membuka Ujian...';

      // 1. Panggil Native Android Bridge (Paling Utama & Pasti Ada)
      if (window.AndroidExam && window.AndroidExam.startExam) {
        console.log('Memanggil AndroidExam.startExam...');
        window.AndroidExam.startExam(url, pin);
        return;
      }

      // 2. Fallback jika lewat Capacitor Plugin CheatAlert
      if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.CheatAlert) {
        try {
          console.log('Memanggil CheatAlert.startCustomExam...');
          await window.Capacitor.Plugins.CheatAlert.startCustomExam({ url, pin });
          return;
        } catch (e) {
          console.error('startCustomExam plugin error:', e);
        }
      }

      // 3. Fallback jika dibuka di browser desktop biasa (bukan aplikasi Android native)
      window.location.href = url;
    }

    btnStart.addEventListener('click', () => startExam());

    // Scanner
    async function openScanner() {
      scannerModal.style.display = 'flex';
      try {
        html5QrCode = new Html5Qrcode('qr-reader');
        await html5QrCode.start(
          { facingMode: 'environment' },
          { fps: 10, qrbox: { width: 220, height: 220 } },
          decodedText => {
            closeScanner();
            urlInput.value = decodedText;
            updateInputState();
            startExam(decodedText);
          },
          () => {}
        );
      } catch (err) {
        console.warn('QR camera error:', err);
      }
    }

    async function closeScanner() {
      if (html5QrCode) {
        try {
          await html5QrCode.stop();
          html5QrCode.clear();
        } catch (e) {}
        html5QrCode = null;
      }
      scannerModal.style.display = 'none';
    }

    btnOpenScanner.addEventListener('click', openScanner);
    btnCloseScanner.addEventListener('click', closeScanner);
    btnCancelScan.addEventListener('click', closeScanner);

    // FAB Floating Action Menu & Confirm Dialog (Identik dengan Exam AA Utama)
    const fabContainer = document.getElementById('fabContainer');
    const fabActions = document.getElementById('fabActions');
    const btnFabToggle = document.getElementById('btnFabToggle');
    const fabIconDots = document.getElementById('fabIconDots');
    const fabIconClose = document.getElementById('fabIconClose');
    const btnFabRefresh = document.getElementById('btnFabRefresh');
    const btnFabExit = document.getElementById('btnFabExit');

    const confirmOverlay = document.getElementById('confirmOverlay');
    const confirmIconBox = document.getElementById('confirmIconBox');
    const confirmTitle = document.getElementById('confirmTitle');
    const confirmDesc = document.getElementById('confirmDesc');
    const btnConfirmNo = document.getElementById('btnConfirmNo');
    const btnConfirmYes = document.getElementById('btnConfirmYes');

    let isFabOpen = false;
    let currentDialogType = null;

    function toggleFab(forceState) {
      isFabOpen = typeof forceState === 'boolean' ? forceState : !isFabOpen;
      if (isFabOpen) {
        fabActions.style.display = 'flex';
        btnFabToggle.classList.add('open');
        fabIconDots.style.display = 'none';
        fabIconClose.style.display = 'block';
      } else {
        fabActions.style.display = 'none';
        btnFabToggle.classList.remove('open');
        fabIconDots.style.display = 'block';
        fabIconClose.style.display = 'none';
      }
    }

    btnFabToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleFab();
    });

    // Touch Drag untuk FAB Container
    let fabDrag = { isDragging: false, startX: 0, startY: 0, initialX: 0, initialY: 0, moved: false };
    btnFabToggle.addEventListener('touchstart', (e) => {
      const touch = e.touches[0];
      const rect = fabContainer.getBoundingClientRect();
      fabDrag = {
        isDragging: true,
        startX: touch.clientX,
        startY: touch.clientY,
        initialX: rect.left,
        initialY: rect.top,
        moved: false
      };
    }, { passive: true });

    btnFabToggle.addEventListener('touchmove', (e) => {
      if (!fabDrag.isDragging) return;
      const touch = e.touches[0];
      const dx = touch.clientX - fabDrag.startX;
      const dy = touch.clientY - fabDrag.startY;
      if (Math.abs(dx) > 6 || Math.abs(dy) > 6) {
        fabDrag.moved = true;
        fabContainer.style.bottom = 'auto';
        fabContainer.style.right = 'auto';
        fabContainer.style.left = (fabDrag.initialX + dx) + 'px';
        fabContainer.style.top = (fabDrag.initialY + dy) + 'px';
      }
    }, { passive: true });

    btnFabToggle.addEventListener('touchend', () => {
      fabDrag.isDragging = false;
    });

    function openConfirmDialog(type) {
      toggleFab(false);
      currentDialogType = type;
      if (type === 'refresh') {
        confirmIconBox.innerHTML = `
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
            <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
            <path d="M16 21h5v-5"/>
          </svg>
        `;
        confirmTitle.textContent = 'Muat Ulang Halaman?';
        confirmDesc.textContent = 'Seluruh progres jawaban yang belum tersimpan mungkin akan hilang.';
        btnConfirmYes.textContent = 'Ya';
        btnConfirmYes.className = 'btn-confirm-yes btn-blue';
      } else {
        confirmIconBox.innerHTML = `
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
        `;
        confirmTitle.textContent = 'Keluar Dari Aplikasi?';
        confirmDesc.textContent = 'Apakah Anda yakin ingin keluar dari aplikasi ujian?';
        btnConfirmYes.textContent = 'Ya';
        btnConfirmYes.className = 'btn-confirm-yes btn-rose';
      }
      confirmOverlay.style.display = 'flex';
    }

    function closeConfirmDialog() {
      confirmOverlay.style.display = 'none';
      currentDialogType = null;
    }

    btnFabRefresh.addEventListener('click', () => openConfirmDialog('refresh'));
    btnFabExit.addEventListener('click', () => openConfirmDialog('exit'));
    btnConfirmNo.addEventListener('click', closeConfirmDialog);

    btnConfirmYes.addEventListener('click', async () => {
      const type = currentDialogType;
      closeConfirmDialog();
      if (type === 'refresh') {
        window.location.reload();
      } else {
        if (window.AndroidExam && window.AndroidExam.exitApp) {
          window.AndroidExam.exitApp();
        } else if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.CheatAlert) {
          try {
            await window.Capacitor.Plugins.CheatAlert.stopAlarm();
          } catch (_) {}
          try {
            await window.Capacitor.Plugins.CheatAlert.exitApp();
          } catch (_) {}
        } else {
          window.close();
        }
      }
    });

    const btnExitApp = document.getElementById('btnExitApp');
    if (btnExitApp) {
      btnExitApp.addEventListener('click', () => openConfirmDialog('exit'));
    }

    loadStorage();
    updateInputState();
  </script>
</body>
</html>
