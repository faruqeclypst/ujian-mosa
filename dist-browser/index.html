<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>EXAM AA Browser</title>
  <script src="./html5-qrcode.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #090d16;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Header */
    .header {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .logo-badge {
      width: 54px;
      height: 54px;
      border-radius: 16px;
      background-color: #1e293b;
      border: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #38bdf8;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
    }

    .title {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.5;
      max-width: 320px;
    }

    /* Card */
    .card {
      background-color: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .label {
      font-size: 12px;
      font-weight: 600;
      color: #cbd5e1;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    input[type="url"],
    input[type="text"] {
      width: 100%;
      background-color: #020617;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 14px;
      color: #ffffff;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="url"]:focus,
    input[type="text"]:focus {
      border-color: #38bdf8;
    }

    .input-actions {
      position: absolute;
      right: 8px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-icon {
      background: none;
      border: none;
      color: #94a3b8;
      padding: 6px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }

    .btn-icon:hover {
      color: #f8fafc;
      background-color: #1e293b;
    }

    /* Action buttons */
    .btn-qr {
      width: 100%;
      background-color: #1e293b;
      border: 1px solid #334155;
      color: #38bdf8;
      padding: 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn-qr:active {
      transform: scale(0.98);
      background-color: #334155;
    }

    /* Chips */
    .chips-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      background-color: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
    }

    .chip:hover {
      background-color: #334155;
      color: #ffffff;
    }

    /* History */
    .history-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-top: 4px;
      border-top: 1px solid #1e293b;
    }

    .history-title {
      font-size: 11px;
      color: #64748b;
      font-weight: 600;
    }

    .history-item {
      background-color: #020617;
      border: 1px solid #1e293b;
      color: #cbd5e1;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }

    .history-item:hover {
      background-color: #1e293b;
    }

    /* Pin Row */
    .pin-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 6px;
      border-top: 1px solid #1e293b;
    }

    .pin-input {
      width: 90px !important;
      text-align: center;
      font-family: monospace;
      font-size: 16px !important;
      letter-spacing: 2px;
      padding: 8px !important;
    }

    /* Submit Button */
    .btn-submit {
      width: 100%;
      background-color: #0284c7;
      border: none;
      color: #ffffff;
      padding: 14px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn-submit:active {
      transform: scale(0.98);
      background-color: #0369a1;
    }

    .btn-submit:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Security note */
    .footer-note {
      text-align: center;
      font-size: 11px;
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* QR Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 16px;
    }

    .modal-card {
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 20px;
      width: 100%;
      max-width: 360px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
    }

    .btn-close {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 20px;
      cursor: pointer;
    }

    #qr-reader {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="logo-badge">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="2" y1="12" x2="22" y2="12"></line>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
        </svg>
      </div>
      <h1 class="title">EXAM AA Browser</h1>
      <p class="subtitle">Kiosk Browser Ujian Bebas. Masukkan URL atau scan QR code soal apa saja.</p>
    </div>

    <!-- Main Card -->
    <div class="card">
      <!-- URL Input -->
      <div class="form-group">
        <label class="label" for="urlInput">Tautan / URL Ujian</label>
        <div class="input-wrapper">
          <input
            id="urlInput"
            type="url"
            placeholder="https://forms.gle/... atau IP Lokal"
            autocomplete="off"
            spellcheck="false"
          />
          <div class="input-actions">
            <button id="btnClear" class="btn-icon" title="Hapus" style="display:none;">✕</button>
            <button id="btnPaste" class="btn-icon" title="Tempel URL">📋 Tempel</button>
          </div>
        </div>
      </div>

      <!-- Scan QR Button -->
      <button id="btnOpenScanner" class="btn-qr">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
        <span>Pindai QR Code Soal</span>
      </button>

      <!-- Quick Presets -->
      <div class="chips-group">
        <button class="chip" data-url="https://docs.google.com/forms">Google Forms</button>
        <button class="chip" data-url="https://forms.office.com">MS Forms</button>
        <button class="chip" data-url="https://quizizz.com/join">Quizizz</button>
      </div>

      <!-- History -->
      <div id="historySection" class="history-group" style="display:none;">
        <span class="history-title">Riwayat Tautan Terakhir:</span>
        <div id="historyList" style="display:flex; flex-direction:column; gap:4px;"></div>
      </div>

      <!-- PIN Setting -->
      <div class="pin-row">
        <div>
          <div class="label" style="display:flex; align-items:center; gap:4px;">
            <span>🔒 PIN Keluar Pengawas</span>
          </div>
          <div style="font-size:10px; color:#64748b;">Wajib diisi pengawas untuk keluar</div>
        </div>
        <input
          id="pinInput"
          type="text"
          pattern="[0-9]*"
          inputmode="numeric"
          maxlength="6"
          value="1234"
          class="pin-input"
        />
      </div>

      <!-- Start Button -->
      <button id="btnStart" class="btn-submit">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
        <span>Mulai Ujian (Kunci Layar)</span>
      </button>
    </div>

    <!-- Footnote -->
    <div class="footer-note">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
      </svg>
      <span>Anti-Cheat, Layar Tersemat & Anti-Screenshot Aktif</span>
    </div>
  </div>

  <!-- QR Scanner Modal -->
  <div id="scannerModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">Arahkan Kamera ke QR Code</h3>
        <button id="btnCloseScanner" class="btn-close">✕</button>
      </div>
      <div id="qr-reader"></div>
      <button id="btnCancelScan" class="btn-qr" style="background:#1e293b; color:#cbd5e1;">Batal</button>
    </div>
  </div>

  <script>
    const urlInput = document.getElementById('urlInput');
    const pinInput = document.getElementById('pinInput');
    const btnClear = document.getElementById('btnClear');
    const btnPaste = document.getElementById('btnPaste');
    const btnStart = document.getElementById('btnStart');
    const btnOpenScanner = document.getElementById('btnOpenScanner');
    const btnCloseScanner = document.getElementById('btnCloseScanner');
    const btnCancelScan = document.getElementById('btnCancelScan');
    const scannerModal = document.getElementById('scannerModal');
    const historySection = document.getElementById('historySection');
    const historyList = document.getElementById('historyList');

    let html5QrCode = null;

    // Load history & PIN
    function loadStorage() {
      try {
        const savedHistory = JSON.parse(localStorage.getItem('exambrowser_history') || '[]');
        if (savedHistory.length > 0) {
          historySection.style.display = 'flex';
          historyList.innerHTML = '';
          savedHistory.slice(0, 3).forEach(url => {
            const btn = document.createElement('button');
            btn.className = 'history-item';
            btn.textContent = url;
            btn.onclick = () => {
              urlInput.value = url;
              updateInputState();
            };
            historyList.appendChild(btn);
          });
        }
        const savedPin = localStorage.getItem('exambrowser_pin');
        if (savedPin) pinInput.value = savedPin;
      } catch (e) {}

      if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.CheatAlert) {
        try {
          window.Capacitor.Plugins.CheatAlert.unlockScreen();
        } catch (e) {}
      }
    }

    function saveToHistory(url) {
      try {
        let history = JSON.parse(localStorage.getItem('exambrowser_history') || '[]');
        history = [url, ...history.filter(h => h !== url)].slice(0, 5);
        localStorage.setItem('exambrowser_history', JSON.stringify(history));
        localStorage.setItem('exambrowser_pin', pinInput.value.trim() || '1234');
      } catch (e) {}
    }

    function updateInputState() {
      btnClear.style.display = urlInput.value ? 'block' : 'none';
      btnPaste.style.display = urlInput.value ? 'none' : 'block';
    }

    urlInput.addEventListener('input', updateInputState);

    btnClear.addEventListener('click', () => {
      urlInput.value = '';
      updateInputState();
      urlInput.focus();
    });

    btnPaste.addEventListener('click', async () => {
      try {
        const text = await navigator.clipboard.readText();
        if (text) {
          urlInput.value = text.trim();
          updateInputState();
        }
      } catch (e) {}
    });

    // Preset chips
    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        urlInput.value = chip.getAttribute('data-url');
        updateInputState();
      });
    });

    // Start Exam
    async function startExam(targetUrl) {
      let url = (targetUrl || urlInput.value).trim();
      if (!url) return;

      if (!/^https?:\/\//i.test(url)) {
        url = 'https://' + url;
      }

      saveToHistory(url);
      const pin = pinInput.value.trim() || '1234';

      btnStart.disabled = true;
      btnStart.textContent = 'Menyiapkan Ujian...';

      if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.CheatAlert) {
        try {
          await window.Capacitor.Plugins.CheatAlert.startCustomExam({ url, pin });
          return;
        } catch (e) {
          console.error('startCustomExam error:', e);
        }
      }

      window.location.href = url;
    }

    btnStart.addEventListener('click', () => startExam());

    // Scanner
    async function openScanner() {
      scannerModal.style.display = 'flex';
      try {
        html5QrCode = new Html5Qrcode('qr-reader');
        await html5QrCode.start(
          { facingMode: 'environment' },
          { fps: 10, qrbox: { width: 220, height: 220 } },
          decodedText => {
            closeScanner();
            urlInput.value = decodedText;
            updateInputState();
            startExam(decodedText);
          },
          () => {}
        );
      } catch (err) {
        console.warn('QR camera error:', err);
      }
    }

    async function closeScanner() {
      if (html5QrCode) {
        try {
          await html5QrCode.stop();
          html5QrCode.clear();
        } catch (e) {}
        html5QrCode = null;
      }
      scannerModal.style.display = 'none';
    }

    btnOpenScanner.addEventListener('click', openScanner);
    btnCloseScanner.addEventListener('click', closeScanner);
    btnCancelScan.addEventListener('click', closeScanner);

    loadStorage();
    updateInputState();
  </script>
</body>
</html>
